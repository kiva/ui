# The service scopes both lists to the recap year and orders them oldest first, so
# `photos` is the leading slice of `stats` and needs no filtering here.
#
# `photos` feeds the borrower grid, which is why it alone asks for name and image.
# `stats` describes the whole year and feeds the map, the sector chart and Total Lent, so
# it asks for as many loans as the service can hold: it keeps only a lender's most recent
# 1000 per category. A limit caps rather than pads, so a lender with five loans gets five.
query goalInReview($achievementId: String!, $year: Int!, $loansLimit: Int = 1000) {
  goalInReview(achievementId: $achievementId, year: $year) {
    id
    count
    transactionSessionCount
    photos: loans(limit: 11) {
      id
      name
      image {
        id
        hash
      }
    }
    stats: loans(limit: $loansLimit) {
      id
      sector {
        id
        name
      }
      geocode {
        country {
          id
          name
          isoCode
          fundsLentInCountry
          geocode {
            latitude
            longitude
          }
        }
      }
      userProperties {
        loanBalance {
          loanId
          totalAmountPurchased
        }
      }
    }
  }
}
