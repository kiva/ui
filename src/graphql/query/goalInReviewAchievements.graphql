# Only the first `count` loans are used, but they are selected oldest-first, so the
# year has to be pulled and sorted locally. 200 covers all but the heaviest lenders.
query goalInReviewAchievements($year: Int, $loanPurchasesLimit: Int = 200) {
  userAchievementProgress(year: $year) {
    id
    tieredLendingAchievements {
      id
      progressForYear
      loanPurchases(limit: $loanPurchasesLimit) {
        purchaseTime
        loan {
          id
          name
          image {
            id
            hash
          }
          sector {
            id
            name
          }
          geocode {
            country {
              id
              name
              isoCode
              fundsLentInCountry
              geocode {
                latitude
                longitude
              }
            }
          }
          userProperties {
            loanBalance {
              loanId
              totalAmountPurchased
            }
          }
        }
      }
    }
  }
}
