#import '../../fragments/shopTotals.graphql'

query initializeCheckout($basketId: String) {
	hasEverLoggedIn @client
	my {
		id
		userAccount {
			id
			balance
			promoBalance
			donateRepayments
		}
		lender {
			id
			loanCount
			memberSince
			teams(limit: 100){
				values {
					name
					id
				}
			}
		}
		loans {
			totalCount
		}
		# Drives the lifecycle re-engagement events. Two rows rather than a totalCount:
		# the stage only distinguishes none / one / more than one purchase, and a count
		# over a long transaction history is the expensive part of this lookup.
		loanPurchases: transactions(
			limit: 2
			filter: {
				# matches the latestLoan filter in myKiva.graphql. Narrower than
				# category: loan, which also covers non-purchase loan transactions.
				type: ["loan_purchase", "direct_loan_purchase"]
				sortBy: newest
			}
		) {
			values {
				effectiveTime
				createTime
			}
		}
		depositIncentiveAmountToLend
	}
	general {
		guestCheckoutEnabled: featureSetting(key: "guest_checkout.enabled") {
			key
			value
			description
		}
		admin_reward_tip_flag: uiConfigSetting(key: "enable_tip_for_admin_reward_lc") {
			key
			value
		}
	}
	shop (basketId: $basketId) {
		id
		basket {
			id
			hasFreeCredits
			credits {
				totalCount
				values {
					amount
					applied
					available
					creditType
					id
				}
			}
			items {
				totalCount
				values {
					creditsUsed {
						amount
						applied
						available
						creditType
						id
						promoFund {
							id
							displayName
							displayDescription
						}
					}
					id
					price
					basketItemType
					... on LoanReservation {
						expiryTime
						isEndingSoon
						donateRepayments
						loan {
							id
							name
							use
							status
							matchingText
							simultaneousMatching {
								managedAccountId
								displayName
								ratio
							}
							loanAmount
							minNoteSize
							plannedExpirationDate
							sector {
								id
								name
							}
							activity {
								id
								name
							}
							geocode {
								country {
									id
									name
									isoCode
								}
							}
							loanFundraisingInfo {
								id
								isExpiringSoon
								fundedAmount
								reservedAmount
							}
							image {
								id
								url: url (presetSize: loan_thumbnail)
								url_2x: url (presetSize: loan_thumbnail_retina)
							}
							tags
							... on LoanDirect {
								sponsor_name: trusteeName
							}
							... on LoanPartner {
								sponsor_name: partnerName
								themes
							}
							gender
							userProperties {
								lentTo
							}
						}
						team {
							id
							name
						}
					}
					... on Donation {
						isTip
						isUserEdited
						metadata {
							campaignId
						}
					}
					... on KivaCard {
						id
						price
						idsInGroup
						quantity
						individualPrice
						kivaCardObject {
							deliveryType
							recipient {
								name
								email
								scheduledDeliveryDate
							}
							mailingInfo {
								firstName
								lastName
								address
								city
								state
								zip
							}
						}
					}
				}
			}
			totals {
				...shopTotals
			}
		}
		basketVerificationState
		lendingRewardOffered
	}
}
