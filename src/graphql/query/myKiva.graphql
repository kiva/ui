query myKivaQuery {
  my {
    id
    isBorrower
    givingFundParticipation {
      totalAmount
      totalCount
    }
    # Fund ID must match COLOMBIA_DISASTER_RELIEF
    reliefFundParticipation: givingFundParticipation(
      filter: { fundIds: ["238fe077-033e-4a59-8d11-e571e6e4ed31"] }
    ) {
      totalCount
    }
    givingFunds {
      totalCount
    }
    loans {
      totalCount
      values {
        id
        name
        gender
        status
        use
        image {
          id
          url
          hash
        }
        tags
        ... on LoanPartner {
          themes
        }
        sector {
          id
        }
        geocode {
          city
          state
          country {
            id
            name
            isoCode
            region
          }
        }
      }
    }
    lender {
      id
      name
      image {
        id
        url
      }
	  publicId
    }
    userAccount {
      id
      publicId
      firstName
      lastName
      balance
      public
      inviterName
    }
    trustee {
      id
    }
    userPreferences {
      id
      preferences
    }
    transactions(
      filter: {
        category: loan
      }
    ) {
      values {
        category
        amount
        effectiveTime
        type
        createTime
        loan {
          id
          name
          gender
          image {
            id
            hash
          }
          geocode {
            country {
              id
              name
              isoCode
            }
          }
          tags
          ... on LoanPartner {
            themes
          }
          sector {
            id
          }
        }
      }
    }
    latestLoan: transactions(
      filter: {
        type: ["loan_purchase", "direct_loan_purchase"]
      }
      limit: 5
    ) {
      values {
		amount
        loan {
          id
          name
          gender
          whySpecial
          image {
            id
            hash
          }
          anonymizationLevel
          geocode {
            country {
              id
              name
              isoCode
              geocode {
                latitude
                longitude
              }
			  ppp
            }
          }
          borrowerCount
          userProperties {
            loanBalance {
              totalAmountPurchased
            }
          }
          ... on LoanPartner {
            themes
			partner {
				id
				loansPosted
				name
			}
          }
        }
      }
    }
    communicationSettings {
			lenderNews
			loanUpdates
    }
  }
  general {
    goal_recommended_loan_enable: uiConfigSetting(key: "goal_set_recommended_loan") {
      key
      value
    }
    goal_in_review_enable: uiConfigSetting(key: "goal_in_review_enable") {
      key
      value
    }
    goal_in_review_in_progress_start: uiConfigSetting(key: "goal_in_review_in_progress_start") {
      key
      value
    }
  }
}
