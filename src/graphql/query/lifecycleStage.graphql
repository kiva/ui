query lifecycleStageQuery {
	my {
		id
		lender {
			id
			memberSince
		}
		# Two rows rather than a totalCount: the stage only distinguishes none / one /
		# more than one purchase, and a count over a long transaction history is the
		# expensive part of this lookup.
		loanPurchases: transactions(
			limit: 2
			filter: {
				# matches the latestLoan filter in myKiva.graphql. Narrower than
				# category: loan, which also covers non-purchase loan transactions.
				type: ["loan_purchase", "direct_loan_purchase"]
				sortBy: newest
			}
		) {
			values {
				effectiveTime
				createTime
			}
		}
	}
}
