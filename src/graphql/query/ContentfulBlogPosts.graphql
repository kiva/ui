query ContentfulBlogPosts($customFields: String, $limit: Int, $skip: Int) {
    contentful {
        blogPosts: searchEntries(
            contentType: "blogPost"
            customFields: $customFields
            limit: $limit
            skip: $skip
        ) {
            total
            skip
            limit
            items {
                entryId
                entry
            }
        }
    }
}
