query MyAcceptedInvites($offset: Int, $limit: Int) {
	my {
		id
		userAccount {
			id
			invites {
				id
				accepted(offset: $offset, limit: $limit) {
					totalCount
					values {
						id
						date
						source
						createdAsType
						teamName
						invitee {
							id
							name
							publicId
						}
						loanCount
					}
				}
			}
		}
	}
}
