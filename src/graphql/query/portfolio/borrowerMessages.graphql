query borrowerMessages($limit: Int, $offset: Int) {
	my {
		id
		updates(limit: $limit, offset: $offset) {
			totalCount
			values {
				id
				type
				subject
				subjectTranslated
				body
				bodyTranslated
				date
				image {
					id
					...borrowerMessageThumbnail
				}
				loan {
					id
					name
					geocode {
						country {
							id
							name
						}
					}
					image {
						id
						...borrowerMessageThumbnail
					}
					... on LoanPartner {
						partner {
							id
							name
							image {
								id
								...borrowerMessageThumbnail
							}
						}
					}
				}
			}
		}
	}
}

fragment borrowerMessageThumbnail on Image {
	id
	default: url(customSize: "s120")
	retina: url(customSize: "s240")
}
